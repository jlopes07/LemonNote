<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="js/head-component.js" data-title="LemonNote - Detalhes da Receita"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/detail.css">
</head>

<body class="dark-theme">
  <div class="app-container">
    <!-- Componentized Header -->
    <header class="app-header" id="app-header-container"></header>

    <!-- Main Workspace -->
    <main class="detail-layout">
      <!-- Back Action and Filter Row -->
      <div class="detail-header-actions">
        <a href="recipes.html" class="btn-secondary" style="padding: 8px 16px;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Voltar para Receitas</span>
        </a>
      </div>

      <!-- Detail Container (dynamic layout) -->
      <div id="detail-container">
        <div class="loading-spinner">Carregando detalhes da receita...</div>
      </div>
    </main>

    <!-- Componentized Footer -->
    <footer class="app-footer" id="app-footer-container"></footer>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/detail.js"></script>
  <script type="module" src="js/components.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/auth-ui.js"></script>
</body>

</html>
