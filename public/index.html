<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="js/head-component.js" data-title="LemonNote - Minha Despensa"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pantry.css">
</head>

<body class="dark-theme">
  <div class="app-container">
    <!-- Componentized Header -->
    <header class="app-header" id="app-header-container"></header>

    <!-- Main Workspace Grid -->
    <main class="pantry-layout">

      <!-- Left Column: Pantry (Despensa Accordion) -->
      <section class="pantry-sidebar">
        <div class="section-card">
          <div class="section-header">
            <div class="title-with-icon">
              <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
              </svg>
              <h2 style="font-family:var(--font-title);">Minha Despensa</h2>
            </div>
            <button id="btn-clear-pantry" class="btn-text">Limpar tudo</button>
          </div>

          <!-- Search Box -->
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="pantry-search" placeholder="Buscar ingrediente...">
          </div>

          <!-- Ingredients List -->
          <div class="ingredients-accordion" id="ingredients-container">
            <div class="loading-spinner">Carregando despensa...</div>
          </div>
        </div>
      </section>

      <!-- Right Column: Current Selection Panel -->
      <section class="section-card selection-panel">
        <div class="panel-header">
          <h2>Itens Selecionados</h2>
        </div>

        <!-- Selected Tags Container -->
        <div class="selected-tags-container" id="selected-tags-container" style="display: none;">
          <!-- Injected dynamically by pantry.js -->
        </div>

        <!-- Empty Selection State -->
        <div class="empty-selection" id="empty-selection">
          <div class="empty-selection-icon">🥫</div>
          <h3>Nenhum ingrediente selecionado</h3>
          <p>Navegue pelas categorias à esquerda e marque os ingredientes que você possui em casa.</p>
        </div>

        <!-- Submit Button CTA -->
        <div class="cta-area">
          <a href="recipes.html" id="btn-submit" class="btn-primary" style="opacity: 0.5; pointer-events: none;">
            <span>Buscar Receitas</span>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </a>
        </div>
      </section>

    </main>

    <!-- Componentized Footer -->
    <footer class="app-footer" id="app-footer-container"></footer>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/pantry.js"></script>
  <script type="module" src="js/components.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/auth-ui.js"></script>
</body>

</html>
