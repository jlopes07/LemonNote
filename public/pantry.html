<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="js/head-component.js" data-title="LemonNote - Minha Despensa"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pantry.css">
</head>

<body class="dark-theme">
  <div class="app-container">
    <!-- Componentized Header -->
    <header class="app-header" id="app-header-container"></header>

    <!-- Main Workspace Grid -->
    <main class="pantry-layout">

      <!-- Left Column: Pantry (Despensa Accordion) -->
      <section class="pantry-sidebar">
        <div class="section-card">
          <div class="section-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <div class="title-with-icon">
              <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
              </svg>
              <h2 style="font-family:var(--font-title);">Minha Despensa</h2>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
              <button id="btn-open-ing-modal" class="btn-primary" style="padding: 6px 12px; font-size: 13px;">+ Novo Ingrediente</button>
              <button id="btn-clear-pantry" class="btn-text">Limpar tudo</button>
            </div>
          </div>

          <!-- Search Box -->
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="pantry-search" placeholder="Buscar ingrediente...">
          </div>

          <!-- Ingredients List -->
          <div class="ingredients-accordion" id="ingredients-container">
            <div class="loading-spinner">Carregando despensa...</div>
          </div>
        </div>
      </section>

      <!-- Right Column: Current Selection Panel -->
      <section class="section-card selection-panel">
        <div class="section-header">
          <h2>Ingredientes Selecionados</h2>
          <span class="selection-badge" id="panel-badge">0 itens</span>
        </div>

        <div class="selection-content" id="selection-list-container">
          <div class="empty-selection" id="empty-selection">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z" />
            </svg>
            <p>Sua despensa está vazia.</p>
            <span class="subtext">Marque os ingredientes ao lado para ver receitas possíveis.</span>
          </div>
          <div id="selected-tags-container" class="selected-tags-wrapper" style="display:none; flex-wrap:wrap; gap:8px;"></div>
        </div>

        <div class="selection-footer">
          <a href="recipes.html" class="btn-primary btn-block btn-recipes-action" id="btn-submit">
            <span>Ver Receitas Sugeridas</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </a>
        </div>
      </section>

    </main>

    <!-- Modal for Creating New Ingredient inside Pantry -->
    <div id="modal-ing-overlay" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:9999; justify-content:center; align-items:center;">
      <div class="modal-card" style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); width:92%; max-width:500px; padding:24px; box-shadow:var(--shadow-lg); position:relative;">
        <button id="btn-close-ing-modal" style="position:absolute; top:16px; right:16px; background:none; border:none; color:var(--text-muted); font-size:22px; cursor:pointer;">&times;</button>
        <h3 style="font-size:1.2rem; font-weight:700; color:var(--text-main); margin-bottom:16px;">Novo Ingrediente</h3>
        
        <form id="modal-ing-form">
          <div class="form-group" style="margin-bottom:12px;">
            <label style="display:block; font-size:13px; margin-bottom:4px; color:var(--text-main); font-weight:500;">Nome do Ingrediente *</label>
            <input type="text" id="modal-ing-name" placeholder="Ex: Queijo Cottage" required style="width:100%; padding:10px 14px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-element); color:var(--text-main); font-size:14px;">
          </div>

          <div style="display:flex; gap:12px; margin-bottom:12px;">
            <div style="flex:1;">
              <label style="display:block; font-size:13px; margin-bottom:4px; color:var(--text-main); font-weight:500;">Categoria *</label>
              <select id="modal-ing-category" required style="width:100%; padding:10px 14px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-element); color:var(--text-main); font-size:14px;">
                <option value="Proteínas & Carnes">Proteínas & Carnes</option>
                <option value="Vegetais & Legumes">Vegetais & Legumes</option>
                <option value="Grãos & Cereais">Grãos & Cereais</option>
                <option value="Laticínios & Derivados">Laticínios & Derivados</option>
                <option value="Despensa & Temperos">Despensa & Temperos</option>
                <option value="Frutas">Frutas</option>
              </select>
            </div>
            <div style="flex:1;">
              <label style="display:block; font-size:13px; margin-bottom:4px; color:var(--text-main); font-weight:500;">Qtd. Base (g/ml) *</label>
              <input type="number" id="modal-ing-base" placeholder="Ex: 100" min="0.1" step="any" required style="width:100%; padding:10px 14px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-element); color:var(--text-main); font-size:14px;">
            </div>
          </div>

          <div style="display:flex; gap:8px; margin-bottom:12px;">
            <div style="flex:1;">
              <label style="display:block; font-size:11px; color:var(--text-muted);">Kcal</label>
              <input type="number" id="modal-ing-cal" placeholder="0" min="0" step="any" style="width:100%; padding:8px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-element); color:var(--text-main); font-size:13px;">
            </div>
            <div style="flex:1;">
              <label style="display:block; font-size:11px; color:var(--text-muted);">Prot (g)</label>
              <input type="number" id="modal-ing-prot" placeholder="0" min="0" step="any" style="width:100%; padding:8px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-element); color:var(--text-main); font-size:13px;">
            </div>
            <div style="flex:1;">
              <label style="display:block; font-size:11px; color:var(--text-muted);">Carb (g)</label>
              <input type="number" id="modal-ing-carb" placeholder="0" min="0" step="any" style="width:100%; padding:8px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-element); color:var(--text-main); font-size:13px;">
            </div>
            <div style="flex:1;">
              <label style="display:block; font-size:11px; color:var(--text-muted);">Gord (g)</label>
              <input type="number" id="modal-ing-fat" placeholder="0" min="0" step="any" style="width:100%; padding:8px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-element); color:var(--text-main); font-size:13px;">
            </div>
          </div>

          <div style="margin-bottom:16px;">
            <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-main); cursor:pointer;">
              <input type="checkbox" id="modal-ing-public" style="accent-color:var(--accent); width:16px; height:16px;">
              <span>Tornar este ingrediente público para todos os usuários</span>
            </label>
          </div>

          <div style="display:flex; justify-content:flex-end; gap:12px;">
            <button type="button" id="btn-cancel-ing-modal" class="btn-secondary" style="padding:8px 16px;">Cancelar</button>
            <button type="submit" class="btn-primary" style="padding:8px 16px;">Salvar Ingrediente</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Componentized Footer -->
    <footer class="app-footer" id="app-footer-container"></footer>
  </div>

  <!-- Scripts -->
  <script src="js/unit-converter.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/pantry.js"></script>
  <script type="module" src="js/components.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/auth-ui.js"></script>
</body>

</html>
