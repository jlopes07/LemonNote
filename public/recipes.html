<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="js/head-component.js" data-title="LemonNote - Receitas Sugeridas"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/recipes.css">
</head>

<body class="dark-theme">
  <div class="app-container">
    <!-- Componentized Header -->
    <header class="app-header" id="app-header-container"></header>

    <!-- Main Workspace -->
    <main class="recipes-layout">
      <!-- Back Action and Filter Row -->
      <div class="recipes-header-row">
        <div class="recipes-title">
          <div style="display:flex; gap:10px; margin-bottom: 12px; flex-wrap:wrap; align-items:center;">
            <a href="pantry.html" class="btn-secondary" style="padding: 8px 16px; display: inline-flex; align-items: center; gap: 8px; text-decoration:none;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
              <span>Voltar para a Despensa</span>
            </a>

            <a href="register.html" class="btn-primary" style="padding: 8px 16px; display: inline-flex; align-items: center; gap: 8px; text-decoration:none; font-weight:600;">
              <span>+ Criar Nova Receita</span>
            </a>
          </div>

          <h2 style="display:flex; align-items:center; gap:8px;">Receitas Sugeridas <span id="recipes-pantry-badge" class="stat-badge" style="font-size:13px; font-weight:600; padding:2px 8px; border-radius:12px; background:var(--bg-element); border:1px solid var(--border-color); color:var(--accent);"><strong id="selected-count">0</strong> na despensa</span></h2>
          <p id="recipes-sub-count">Analisando sua despensa...</p>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">Todas</button>
          <button class="filter-tab" data-filter="favorites">Favoritas</button>
          <button class="filter-tab" data-filter="ready">Prontas para Fazer</button>
          <button class="filter-tab" data-filter="missing-few">Quase Prontas</button>
          <button class="filter-tab" data-filter="my-recipes">Minhas Receitas</button>
        </div>
      </div>

      <!-- Recipe Search & Sort Bar -->
      <div style="display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;">
        <div style="flex: 2; min-width: 280px;">
          <input type="text" id="recipe-search" placeholder="Buscar receita por nome, ingrediente ou categoria..." style="width: 100%; padding: 14px 18px; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); font-size: 0.95rem; outline: none; transition: all 0.2s ease;" />
        </div>
        <div style="flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0 16px;">
          <span style="font-size: 13px; color: var(--text-muted); white-space: nowrap;">Ordenar por:</span>
          <select id="recipe-sort" style="width: 100%; background: transparent !important; border: none !important; color: var(--text-main); font-size: 0.95rem; outline: none; cursor: pointer; padding: 14px 0;">
            <option value="match" selected>Maior Compatibilidade</option>
            <option value="name">Ordem Alfabética (A-Z)</option>
            <option value="time">Tempo de Preparo</option>
            <option value="calories">Menos Calorias</option>
            <option value="protein">Mais Proteína</option>
          </select>
        </div>
      </div>

      <!-- Recipes Grid -->
      <div class="recipes-grid" id="recipes-container">
        <!-- Injected dynamically by recipes.js -->
        <div class="loading-spinner">Buscando receitas...</div>
      </div>
    </main>

    <!-- Componentized Footer -->
    <footer class="app-footer" id="app-footer-container"></footer>
  </div>

  <script src="js/unit-converter.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/recipes.js"></script>
  <script type="module" src="js/components.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/auth-ui.js"></script>
</body>

</html>
