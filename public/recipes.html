<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="js/head-component.js" data-title="LemonNote - Receitas Sugeridas"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/recipes.css">
</head>

<body class="dark-theme">
  <div class="app-container">
    <!-- Componentized Header -->
    <header class="app-header" id="app-header-container"></header>

    <!-- Main Workspace -->
    <main class="recipes-layout">
      <!-- Back Action and Filter Row -->
      <div class="recipes-header-row">
        <div class="recipes-title">
          <a href="pantry.html" class="btn-secondary" style="margin-bottom: 12px; padding: 8px 16px; display: inline-flex; align-items: center; gap: 8px;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Voltar para a Despensa</span>
          </a>
          <h2>Receitas Sugeridas</h2>
          <p id="recipes-sub-count">Analisando sua despensa...</p>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">Todas</button>
          <button class="filter-tab" data-filter="ready">Prontas para Fazer</button>
          <button class="filter-tab" data-filter="missing-few">Quase Prontas</button>
        </div>
      </div>

      <!-- Recipe Search Bar Bar -->
      <div class="recipe-search-box" style="margin-bottom: 24px;">
        <input type="text" id="recipe-search" placeholder="🔍 Buscar receita por nome, ingrediente ou categoria..." style="width: 100%; padding: 14px 18px; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-heading); font-size: 0.95rem; outline: none; transition: all 0.2s ease;" />
      </div>

      <!-- Recipes Grid -->
      <div class="recipes-grid" id="recipes-container">
        <!-- Injected dynamically by recipes.js -->
        <div class="loading-spinner">Buscando receitas...</div>
      </div>
    </main>

    <!-- Componentized Footer -->
    <footer class="app-footer" id="app-footer-container"></footer>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/recipes.js"></script>
  <script type="module" src="js/components.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/auth-ui.js"></script>
</body>

</html>
