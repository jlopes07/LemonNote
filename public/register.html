<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="js/head-component.js" data-title="LemonNote - Cadastrar Receitas e Ingredientes"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/register.css">
</head>

<body class="dark-theme">
  <div class="app-container">
    <!-- Componentized Header -->
    <header class="app-header" id="app-header-container"></header>

    <!-- Main Workspace -->
    <main style="display:flex; flex-direction:column; gap:20px;">
      <!-- Back button and Navigation -->
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <a href="index.html" class="btn-secondary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Voltar para Despensa</span>
        </a>
        <h2 style="font-family:var(--font-title); font-size:24px; font-weight:700;">Painel de Cadastro</h2>
      </div>

      <!-- Forms Layout -->
      <div class="register-layout">

        <!-- Left Column: Add Ingredient -->
        <section class="section-card register-card">
          <h2>Novo Ingrediente</h2>
          <form id="ing-form">
            <div class="form-group">
              <label for="ing-name">Nome do Ingrediente *</label>
              <input type="text" id="ing-name" placeholder="Ex: Peito de Frango" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="ing-category">Categoria *</label>
                <select id="ing-category" required>
                  <option value="" disabled selected>Selecione...</option>
                  <option value="Proteínas">Proteínas</option>
                  <option value="Carboidratos">Carboidratos</option>
                  <option value="Vegetais & Legumes">Vegetais & Legumes</option>
                  <option value="Laticínios & Derivados">Laticínios & Derivados</option>
                  <option value="Despensa & Temperos">Despensa & Temperos</option>
                  <option value="Frutas">Frutas</option>
                </select>
              </div>
              <div class="form-group">
                <label for="ing-base-amount">Qtd. Base Referência (g/unidades) *</label>
                <input type="number" id="ing-base-amount" placeholder="Ex: 100 ou 1" min="0.1" step="any" required>
              </div>
            </div>

            <div style="margin-top: 10px; margin-bottom: 5px;">
              <span style="font-size: 13px; font-weight: 600; color: var(--accent-light);">Macronutrientes da
                Referência</span>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="ing-calories">Energia (kcal)</label>
                <input type="number" id="ing-calories" placeholder="Ex: 165" min="0" step="any">
              </div>
              <div class="form-group">
                <label for="ing-protein">Proteína (g)</label>
                <input type="number" id="ing-protein" placeholder="Ex: 31" min="0" step="any">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="ing-carbs">Carboidratos (g)</label>
                <input type="number" id="ing-carbs" placeholder="Ex: 0" min="0" step="any">
              </div>
              <div class="form-group">
                <label for="ing-fat">Gordura (g)</label>
                <input type="number" id="ing-fat" placeholder="Ex: 3.6" min="0" step="any">
              </div>
            </div>

            <div class="form-group checkbox-group" style="margin-top: 14px;">
              <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13.5px; color: var(--text-heading); font-weight: 500;">
                <input type="checkbox" id="ing-is-public" style="width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer;">
                <span>Deseja tornar este ingrediente público para todos os usuários?</span>
              </label>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-primary">Salvar Ingrediente</button>
            </div>
          </form>
        </section>

        <!-- Right Column: Add Recipe -->
        <section class="section-card register-card">
          <h2>Nova Receita</h2>
          <form id="rec-form">
            <div class="form-group">
              <label for="rec-name">Nome da Receita *</label>
              <input type="text" id="rec-name" placeholder="Ex: Risoto de Brócolis Cremoso" required>
            </div>

            <div class="form-group">
              <label for="rec-desc">Descrição curta *</label>
              <textarea id="rec-desc"
                placeholder="Ex: Uma versão deliciosa e prática de risoto utilizando arroz cozido e brócolis."
                required></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="rec-time">Tempo de Preparo (minutos) *</label>
                <input type="number" id="rec-time" placeholder="Ex: 25" min="1" required>
              </div>
              <div class="form-group">
                <label for="rec-servings">Rendimento (Porções Base) *</label>
                <input type="number" id="rec-servings" placeholder="Ex: 2" min="1" required>
              </div>
            </div>

            <div class="form-group">
              <label for="rec-image">Link da Imagem (URL)</label>
              <input type="url" id="rec-image" placeholder="Ex: https://images.unsplash.com/...">
            </div>

            <!-- Dynamic Ingredients Builder row -->
            <div class="inline-add-row" style="margin-top:10px; align-items:flex-start;">
              <div class="form-group" style="flex:2;">
                <label for="rec-ing-input">Ingredientes Necessários (digite para buscar) *</label>
                <input type="text" id="rec-ing-input" list="ingredients-datalist" placeholder="Digite o nome (ex: Ovo, Frango, Leite)..." autocomplete="off" style="width:100%; padding:10px 14px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-heading); font-size:14px;">
                <datalist id="ingredients-datalist">
                  <!-- Populated dynamically by register.js -->
                </datalist>
              </div>
              <div class="form-group qty-col" style="flex:1;">
                <label for="rec-ing-qty">Qtd. *</label>
                <input type="number" id="rec-ing-qty" placeholder="Ex: 150" min="0.1" step="any" style="width:100%; padding:10px 14px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-heading); font-size:14px;">
              </div>
              <div class="form-group unit-col" style="flex:1;">
                <label for="rec-ing-unit">Unidade *</label>
                <input type="text" id="rec-ing-unit" placeholder="g, ml..." value="g" style="width:100%; padding:10px 14px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-heading); font-size:14px;">
              </div>
              <button type="button" id="btn-add-ing" class="btn-secondary" style="height:42px; padding:0 18px; margin-top:24px; font-weight:700;"
                title="Adicionar ingrediente à lista">+</button>
            </div>

            <!-- List of added ingredients -->
            <div class="form-group" style="margin-top: 8px;">
              <label>Ingredientes Adicionados:</label>
              <div class="added-list" id="added-ing-list">
                <span class="text" style="color:var(--text-muted)">Nenhum ingrediente adicionado.</span>
              </div>
            </div>

            <!-- Dynamic Instructions Builder row -->
            <div class="inline-add-row" style="margin-top:14px; align-items:flex-start;">
              <div class="form-group" style="flex:1;">
                <label for="rec-step-text">Modo de Preparo (Passo a Passo) *</label>
                <textarea id="rec-step-text" rows="3" placeholder="Digite ou cole os passos (pode colar múltiplos passos de uma vez, um por linha)..." style="width:100%; padding:10px 14px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-heading); font-family:inherit; font-size:14px; resize:vertical;"></textarea>
              </div>
              <button type="button" id="btn-add-step" class="btn-secondary" style="height:45px; padding:0 16px; margin-top:24px;"
                title="Adicionar passos à lista">+</button>
            </div>

            <!-- List of added steps -->
            <div class="form-group" style="margin-top: 8px;">
              <label>Passos Adicionados:</label>
              <div class="added-list" id="added-steps-list">
                <span class="text" style="color:var(--text-muted)">Nenhum passo de instrução adicionado.</span>
              </div>
            </div>

            <div class="form-group checkbox-group" style="margin-top: 14px;">
              <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13.5px; color: var(--text-heading); font-weight: 500;">
                <input type="checkbox" id="rec-is-public" style="width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer;">
                <span>Deseja tornar esta receita pública para todos os usuários?</span>
              </label>
            </div>

            <div class="form-actions" style="margin-top: 20px;">
              <button type="submit" class="btn-primary"
                style="background: linear-gradient(135deg, var(--accent-yellow), var(--accent));">Salvar
                Receita</button>
            </div>
          </form>
        </section>

      </div>
    </main>

    <!-- Componentized Footer -->
    <footer class="app-footer" id="app-footer-container"></footer>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/register.js"></script>
  <script type="module" src="js/components.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/auth-ui.js"></script>
</body>

</html>
